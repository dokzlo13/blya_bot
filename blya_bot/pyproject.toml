[project]
name = "blya_bot"
version = "0.2.0"
description = ""
authors = [{ name = "Alexey Zakharov", email = "dokzlo13@gmail.com" }]
requires-python = ">=3.13"

dependencies = [
    "emoji>=2.0.0",
    "aiohttp>=3.10.5",
    "ahocorapy>=1.6.1",
    "structlog>=24.4.0",
    "aiogram>=3.13.1",
    "ahocorasick-rs>=0.22.0",
    "aiosqlite>=0.20.0",
    "msgpack>=1.1.2",
    "zstandard>=0.25.0",
    "pydantic-settings>=2.12.0",
]

[project.optional-dependencies]
pywhispercpp = ["pywhispercpp>=1.2.0"]
faster-whisper = ["faster-whisper>=1.0.3"]
vosk = ["vosk>=0.3.43"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "memory-profiler>=0.61.0",
    "Pympler>=1.1",
]

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blya_bot"]

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

[tool.ruff]
exclude = [
  ".venv", ".eggs", "dist", "build", "__pycache__",
  ".pytest_cache", ".mypy_cache", ".ruff_cache",
]
line-length = 120

[tool.ruff.lint]
# List of enabled rulsets.
# See https://docs.astral.sh/ruff/rules/ for more information.
select = [
    "E",   # Error
    "F",   # Pyflakes
    "W",   # Pycodestyle
    "C90", # McCabe complexity
    "I",   # Isort
    "N",   # pep8-naming
    "D",   # Pydocstyle
    "ANN", # Pytype annotations
    "S",   # Bandit
    "B",   # Bugbear
    "COM", # Commas
    "C4",  # Comprehensions
    "ISC", # Implicit string concat
    "PIE", # Unnecessary code
    "T20", # Catch prints
    "PYI", # validate pyi files
    "Q",   # Checks for quotes
    "RSE", # Checks raise statements
    "RET", # Checks return statements
    "SLF", # Self checks
    "SIM", # Simplificator
    "PTH", # Pathlib checks
    "ERA", # Checks for commented out code
    "PL",  # PyLint checks
    "RUF", # Specific to Ruff checks
]
ignore = [
    "RUF100",   # NOQA directive
    "D105",     # Missing docstring in magic method
    "D107",     # Missing docstring in __init__
    "B008",     # Do not perform function calls in argument defaults
    "D211",     # No blank lines allowed before class docstring
    "D212",     # Multi-line docstring summary should start at the first line
    "D401",     # First line should be in imperative mood
    "D104",     # Missing docstring in public package
    "D100",     # Missing docstring in public module
    "D202",     # No blank lines allowed after function docstring
    "ANN401",   # typing.Any are disallowed in `**kwargs
    "PLR0913",  # Too many arguments for function call
    "D106",     # Missing docstring in public nested class
    "ASYNC109", # Checks for async function definitions with timeout parameters.
]
mccabe = { max-complexity = 10 }

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # Use of assert detected
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "float", "bytes"]
