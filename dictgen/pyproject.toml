[project]
name = "dictgen"
version = "0.1.0"
description = "Dictionary generator for blya_bot"
requires-python = ">=3.13"
dependencies = [
    "blya_bot",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "structlog>=25.4.0",
]

[tool.uv.sources]
blya_bot = { path = "../blya_bot", editable = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictgen"]

